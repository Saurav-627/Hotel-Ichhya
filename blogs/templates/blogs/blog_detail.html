{% extends 'base.html' %}

{% block content %}
<article class="max-w-4xl mx-auto py-8 sm:py-16 px-4 sm:px-6 lg:px-8">
    <div class="space-y-4 sm:space-y-6 text-center">
        <span class="text-[11px] sm:text-xs uppercase font-mono tracking-widest opacity-60">{{ post.created_at|date:"M d, Y" }} | Published by {{ post.author.get_full_name|default:post.author.username }}</span>
        <h1 class="font-luxury-title text-2xl sm:text-4xl lg:text-5xl font-bold leading-tight">{{ post.title }}</h1>
        <div class="w-20 sm:w-24 h-0.5 bg-luxuryGold-500 mx-auto mt-3 sm:mt-4"></div>
    </div>

    {% if post.featured_image %}
    <div class="my-6 sm:my-12 overflow-hidden rounded-2xl border border-amber-900/10 max-h-[300px] sm:max-h-[500px]">
        <img src="{{ post.featured_image.url }}" alt="{{ post.title }}" class="w-full h-full object-cover">
    </div>
    {% endif %}

    <div class="prose max-w-none text-xs sm:text-sm opacity-85 leading-relaxed space-y-4 sm:space-y-6">
        {{ post.content|safe }}
    </div>

    <div class="mt-10 sm:mt-16 pt-6 sm:pt-8 border-t border-amber-900/10 flex flex-col sm:flex-row items-center justify-between gap-4">
        <a href="{% url 'blogs:blog_list' %}" class="text-xs font-bold uppercase tracking-wider text-luxuryGold-500 hover:underline inline-flex items-center gap-1.5"><i class="fa-solid fa-arrow-left"></i> Back to Journal</a>
        <div class="flex items-center gap-3 text-xs opacity-75">
            <span>Share:</span>
            <a href="#" class="hover:text-luxuryGold-500 p-1"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#" class="hover:text-luxuryGold-500 p-1"><i class="fa-brands fa-twitter"></i></a>
            <a href="#" class="hover:text-luxuryGold-500 p-1"><i class="fa-brands fa-pinterest-p"></i></a>
        </div>
    </div>
</article>
{% endblock %}
