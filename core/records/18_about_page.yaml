  ceo_signature_text: "Rewanta Prasad Dhaubhadel (Rebu)"
  ceo_quote: "With a heart rooted in tradition and eyes set on innovation, I remain committed to advancing Nepal’s hospitality industry and creating opportunities for sustainable growth and global recognition."
  ceo_message: >-
    Rewanta Prasad Dhaubhadel (fondly known as Rebu) brings over 27 years of distinguished leadership across the hospitality, tourism, and education sectors. Holding an International Diploma in Hotel Management from the Swiss Hotel Management School (SHMS), Switzerland, and a degree in Business Administration from Nepal, Mr. Dhaubhadel embodies a harmonious blend of Swiss precision and authentic Nepalese warmth.

    His extensive international experience spanning Geneva, Lausanne, and Montreux enriched his understanding of global hospitality standards, culinary innovation, and guest satisfaction. Returning to Nepal, he held key leadership roles at Hotel Royal Singi, oversaw corporate travel operations, and served as CEO of Global Academy of Tourism & Hospitality Education (GATE College), nurturing thousands of future hospitality leaders.

    At Hotel Ichchha, his vision is to transform Simara into Nepal's leading luxury leisure and MICE destination, combining world-class 5-star comfort with sustainable community growth.

